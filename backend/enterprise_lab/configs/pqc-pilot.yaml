# LAB / SYNTHETIC controlled config - see enterprise_lab/README.md
application:
  name: pqc-pilot
  business_unit: security
  business_importance: medium
  description: >
    Early-adopter pilot program - services deliberately migrated ahead of the
    rest of the fleet, used to exercise the "already migrated / hybrid" states
    of the inventory and PQC-adoption metrics.

assets:
  - hostname: pilot-vpn-gateway
    usage_type: key_exchange
    protocol: "hybrid TLS 1.3 key exchange"
    algorithm_id: HYBRID-ECDH-ML-KEM-768
    data_sensitivity: high
    data_lifetime_years: 3
    asset_criticality: high
    internet_exposure: true
    migration_complexity: medium
    current_status: hybrid

  - hostname: pilot-messaging-kx
    usage_type: key_exchange
    protocol: "PQC-only TLS 1.3 key exchange"
    algorithm_id: ML-KEM-768
    data_sensitivity: medium
    data_lifetime_years: 2
    asset_criticality: medium
    internet_exposure: true
    migration_complexity: medium
    current_status: pqc_migrated

  - hostname: pilot-doc-signer
    usage_type: signing
    protocol: "document signing"
    algorithm_id: ML-DSA-65
    data_sensitivity: high
    data_lifetime_years: 5
    asset_criticality: medium
    internet_exposure: false
    migration_complexity: medium
    current_status: pqc_migrated

  - hostname: pilot-firmware-signer
    usage_type: signing
    protocol: "firmware image signing (long-lived trust anchor)"
    algorithm_id: SLH-DSA-SHA2-128F
    data_sensitivity: high
    data_lifetime_years: 15
    asset_criticality: high
    internet_exposure: false
    migration_complexity: high
    current_status: pqc_migrated
