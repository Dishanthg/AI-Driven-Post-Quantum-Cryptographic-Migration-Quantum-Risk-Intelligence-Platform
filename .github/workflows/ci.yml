name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check app

      - name: Unit + integration tests
        # Full suite (crypto providers, quantum labs, AI risk engine, benchmark
        # engine, discovery scanner, migration pipeline, crypto-agility demo,
        # API, algorithm registry, research-integrity labeling). This runs real
        # Qiskit/Aer simulations and PQC keygen, so it is slower than a typical
        # unit suite (~1-2 min) but is deliberately NOT skipped on every PR -
        # see design doc Section 68 for the "no fake metrics" rationale.
        run: python -m pytest -v

      - name: pip-audit dependency scan
        run: |
          pip install pip-audit -q
          pip-audit -r requirements.txt --desc || true

  postgres-integration:
    # Verifies the docker-compose PostgreSQL deployment path, not just the
    # SQLite dev/test default the main `backend` job's pytest suite uses -
    # this specifically caught a real VARCHAR(32)-too-narrow bug
    # (assets.protocol) that SQLite silently tolerated. See ADR-002 and
    # docs/masters-application/13_failures_and_lessons.md.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantumshield
          POSTGRES_PASSWORD: quantumshield_ci_only
          POSTGRES_DB: quantumshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantumshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      QS_DATABASE_URL: postgresql+psycopg://quantumshield:quantumshield_ci_only@localhost:5432/quantumshield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply Alembic migrations against real PostgreSQL
        run: python -m alembic upgrade head
      - name: Run the full demo pipeline against real PostgreSQL
        run: python -m scripts.run_demo --retrain

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: npm audit dependency scan
        run: npm audit --audit-level=high || true
